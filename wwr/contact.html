<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us | White Water Rafting Adventures</title>

    <meta name="description"
      content="Contact White Water Rafting Adventures for questions, reservations, and rafting information. Send us a message or subscribe to our newsletter.">
    <meta name="author" content="Jessica Felix">

    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <!-- HEADER -->
    <header>
        <img src="images/logo.png" alt="White Water Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <!-- HERO -->
        <section class="hero contact-hero">
            <h1>White Water Rafting Companys</h1>
        </section>

        <p><strong>Address:</strong> 66 Wolji Road,Artillary, PortHarcourt, Nigeria</p>
        <p><strong>Phone:</strong> +234 7036478219</p>
        <p><strong>Email:</strong> jf043966@gmail.com</p>


        <iframe class="contact-map"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3703.0306277005016!2d7.053816727526484!3d4.822597065255944!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1069cd06ed883adb%3A0x1b40a8e78d0bf2f8!2s66%20Woji%20Rd%2C%20Rivers%2C%20Port%20Harcourt%20500102%2C%20Rivers!5e0!3m2!1sen!2sng!4v1771268874313!5m2!1sen!2sng"
          alt="goggle map" referrerpolicy="no-referrer-when-downgrade">
        </iframe>


        <!-- CONTACT FORM -->
        <section class="contact-form">
            <h2>Send Us a Message</h2>

            <form action="#" method="post">
                <label class="name">Full Name:</label>
                <input type="text" id="text" name="name" required>

                <label class="email">Email Address:</label>
                <input type="email" id="email" name="email" required>

                <fieldset>
                    <legend>Purpose of Message:</legend>

                    <label>
                        <input type="radio" id="radio" name="purpose" value="general" required>
                        General Inquiry
                    </label>

                    <label>
                        <input type="radio" id="purpose" name="purpose" value="reservation">
                        Reservation Question
                    </label>

                    <label>
                        <input type="radio" id="purpose" name="purpose" value="website">
                        Website Suggestion
                    </label>
                </fieldset>

                <label class="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <label class="checkbox">
                    <input type="Submit" id="suscribe" name="subscribe">
                    Please subscribe me to the monthly newsletter
                </label>

                <button type="click here to send">Send Message</button>
            </form>
        </section>
        <div class="team-grid">
            <figure>
                <img src="images/employee1.jpg" alt="Employee 1">
                <figcaption>Ebenezer — Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employee2.jpg" alt="Employee 2">
                <figcaption>Amara — Safety Officer</figcaption>
            </figure>

            <figure>
                <img src="images/employee3.jpg" alt="Employee 3">
                <figcaption>Jessica — Support customer service</figcaption>
            </figure>

        </div>
    </main>

    <!-- FOOTER -->
    <footer>
        <p>&copy; 2026 White Water Rafting | Jessica Felix</p>

        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook">
            </a>

            <a href="https://twitter.com">
                <img src="images/twitter.png" alt="Twitter">
            </a>

            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram">
            </a>
        </nav>
    </footer>

</body>

</html>
